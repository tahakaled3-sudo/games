const row=(u,i,p,tx)=>`<div class="row g${i}"><span class=rb>${i+1}</span>${AV(u)}<span class=n>${NM(u)}</span><span class=t>${tx||''}</span><span class=p>${p}</span></div>`;
const gridH=(c,r)=>'<div class=g><i></i>'+[...'ABCDEF'].map(x=>`<i>${x}</i>`).join('')+c.g.map((v,i)=>(i%6?'':`<i>${i/6+1}</i>`)+`<i class="${v==2?'h':v==3?'m':r&&v==1?'s':''}">${v==2?'💥':v==3?'•':''}</i>`).join('')+'</div>';
let aud;
function playA(i){if(st.ph!='q'||!st.cur.au)return;const U=st.cur.au,es=$('#as');i=i==null?st.ai||0:i;if(i>=U.length){es&&(es.innerHTML='⚠️ تعذر تحميل صوت الآية — تأكد من الإنترنت');return}
try{if(aud)aud.pause();const a=aud=new Audio(U[i]);a.muted=mute;a.onerror=()=>{if(aud==a){st.ai=i+1;playA(i+1)}};a.onplaying=()=>{st.ai=i;es&&(es.textContent='🔊 جاري تشغيل الآية')};a.onended=()=>setTimeout(()=>playA(),2500);
a.play().catch(e=>{if(e&&e.name=='NotAllowedError'&&es)es.innerHTML='<button onclick="playA()" style="padding:8px 16px;border-radius:10px;border:1px solid #1fe01f;background:#0b2a10;color:#fff;font-size:15px">🔊 اضغط لتفعيل الصوت</button>'})}catch(e){}}
async function loadW(im){try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(im.dataset.w)),j=await r.json(),u=j.thumbnail&&j.thumbnail.source;if(!u)throw 0;im.src=u}catch(e){if(st.ph=='q'&&++st.fail<4)setTimeout(next,200)}}
function next(){if(aud){aud.pause();aud=null}clearTimeout(tm);clearTimeout(rt);clearInterval(iv);$('#rf').hidden=true;let k=md.value;if(k=='auto'){const ks=Object.keys(G).filter(x=>EN[x]!==false),kk=ks.length?ks:Object.keys(G);k=kk[ord++%kk.length]}st.mode=k;st.cur=G[k].f();st.ans=new Set();st.rd={};st.ph='q';st.t0=Date.now();SFX.start();const c=st.cur;
$('#view').innerHTML=`<div class=cat>${G[k].n}</div><div class="card qc"><div class=q>${c.q}</div>${c.bs?'<div id=gr></div>':''}</div><div class=pm>✍️ اكتب إجابتك في الشات الآن</div><div class=pm2>الإجابات تصل الآن... جاوب قبل انتهاء الوقت</div><div id=chips></div>${c.au?'<div id=as class=pm2>⏳ جاري تحميل الصوت...</div>':''}`;st.ai=0;draw();iv=setInterval(tick,100);tick();tm=setTimeout(end,c.t*1000);if(c.au)playA();const im=$('#view').querySelector('img[data-w]');if(im)loadW(im)}
function tick(){const L=st.cur.t-(Date.now()-st.t0)/1000,sc=Math.ceil(L);$('#rc').style.strokeDashoffset=163.4*(1-Math.max(0,L)/st.cur.t);$('#tm').textContent=Math.max(0,sc);if(sc<=5&&sc>0&&sc!=lastSec){lastSec=sc;SFX.tick()}}
function end(){if(st.ph!='q')return;st.fail=0;if(aud){aud.pause();aud=null}clearTimeout(tm);clearInterval(iv);for(const u in st.str)if(!st.rd[u])st.str[u]=0;for(const u in st.rd)st.str[u]=(st.str[u]||0)+1;st.ph='r';SFX.end();draw();tm=setTimeout(()=>{st.ph='l';draw();tm=setTimeout(()=>st.ans.size?raffle():next(),5500)},6500)}
function chat(e){const u=e.uid||e.user;st.u[u]={n:e.user,av:e.avatar};st.part.add(u);if(st.ph=='q'){st.ans.add(u);const c=st.cur,t=(Date.now()-st.t0)/1000;if(c.bs)shot(u,e.text,t);else if(!st.rd[u]&&c.a.some(x=>N(x)==N(e.text))){const p=P[Object.keys(st.rd).length]||1;st.rd[u]={p,t};st.tot[u]=(st.tot[u]||0)+p;SFX.ok()}}draw()}
function shot(u,s,t){s=D(s).replace(/[\s\u0640]/g,'').replace(/[إأآ]/g,'ا');const m=s.match(/^([a-f]|[ابجدهو])([1-6])$/i)||s.match(/^([1-6])([a-f]|[ابجدهو])$/i);if(!m)return;const[l,n]=isNaN(m[1])?[m[1],m[2]]:[m[2],m[1]],L=l.toLowerCase(),c='abcdef'.includes(L)?'abcdef'.indexOf(L):'ابجدهو'.indexOf(l),x=(n-1)*6+c,g=st.cur.g;if(g[x]==1){g[x]=2;const r=st.rd[u]||(st.rd[u]={p:0,t});r.p+=3;st.tot[u]=(st.tot[u]||0)+3;if(!g.includes(1))setTimeout(end,600)}else if(g[x]==0)g[x]=3}

function draw(){const c=st.cur;$('#s1').textContent=st.part.size;$('#s2').textContent=st.ans.size;if(!c)return;const V=$('#view'),ph=st.ph;$('#hud').style.display=ph=='q'?'flex':'none';
const rr=Object.entries(st.rd);
if(ph=='q'){if(c.bs)$('#gr').innerHTML=gridH(c,0);$('#chips').innerHTML=rr.sort((a,b)=>a[1].t-b[1].t).slice(0,30).map(([u,v])=>`<span class=ch>${AV(u)}+${v.p}</span>`).join('')}
else if(ph=='r'){const n=st.ans.size,pct=n?Math.round(rr.length/n*100):0,fast=rr.length?Math.min(...rr.map(x=>x[1].t)):0,f=rr.sort((a,b)=>c.bs?b[1].p-a[1].p:a[1].t-b[1].t).slice(0,3);
V.innerHTML=`<div class=card><div class=lb>✅ الإجابة الصحيحة</div><div class=q style="color:#1fe01f">${c.bs?'🚢 انتهت المعركة':E(c.a[0])}</div>${c.bs?gridH(c,1):''}</div><div class="card sp"><div class=pr style="background:conic-gradient(#1fe01f ${pct*3.6}deg,#222 0)"><b>${pct}%</b></div><div class=sl><div>👥 المشاركون <b>${st.part.size}</b></div><div>💬 أجابوا <b>${n}</b></div><div>⚡ أسرع إجابة <b>${c.bs?'-':fast.toFixed(2)+'s'}</b></div></div></div><h4>⚡ الأسرع إجابة</h4>`+(f.map(([u,v],i)=>row(u,i,'+'+v.p,c.bs?'':v.t.toFixed(2)+'s')).join('')||'<div class=row>لا توجد إجابات صحيحة</div>')}
else if(ph=='l'){V.innerHTML='<div class=ti>🏆 لوحة الترتيب</div>'+(Object.entries(st.tot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([u,v],i)=>row(u,i,v,(st.str[u]>1?'🔥 '+st.str[u]+'× متتالية':''))).join('')||'<div class=row>لا نقاط بعد</div>')}}
function raffle(){const ids=[...st.ans],b=$('#rf'),w=R(ids),n=ids.length,sz=Math.max(28,Math.min(52,230/Math.sqrt(n)/1.4|0)),rx=150-sz/2,ry=130-sz/2;b.hidden=false;st.ph='w';
b.innerHTML='<div class=ti>🎬 السحب السينمائي</div><div class=sub>كل من أجاب في هذه الجولة دخل القرعة</div><div id=cl></div><div id=nt>...</div>';
const cl=$('#cl'),els=ids.map((u,i)=>{const r=Math.sqrt((i+.5)/n),a=i*2.4,d=document.createElement('div');d.className='c';d.style.cssText=`--s:${sz}px;left:${150+Math.cos(a)*r*rx-sz/2}px;top:${130+Math.sin(a)*r*ry-sz/2}px`;d.innerHTML=AV(u);cl.appendChild(d);return d});
const wi=ids.indexOf(w);let step=0,cur=-1;SFX.whoosh();
const go=()=>{if(cur>=0)els[cur].classList.remove('hl');const last=step==26;cur=last?wi:(Math.random()*n|0);els[cur].classList.add('hl');$('#nt').innerHTML=NM(ids[cur]);SFX.tick();if(last){rt=setTimeout(win,900);return}step++;rt=setTimeout(go,60+step*step*.55)};
const win=()=>{SFX.boom();SFX.fan();st.tot[w]=(st.tot[w]||0)+2;const lv=1+Math.floor(st.tot[w]/10);b.innerHTML=`<div class=badge>👑 بطل القرعة الكبرى</div><div class=wv><span class=rg></span><span class="rg r2"></span><div class=wa style="--s:140px">${AV(w)}<em>المستوى ${lv}</em></div></div><div class=wn>${NM(w)}</div><div class=wp>+2 نقطة</div><div id=fl></div>`;rt=setTimeout(next,4800)};
go()}

const TABS={Q:['أسئلة عامة','السؤال','الإجابات (افصل بـ |)'],F:['أعلام','كود الدولة (مثل sa)','اسم الدولة (افصل بـ |)'],C:['كلمة مشتركة','الكلمات (افصل بـ •)','الإجابة'],A:['ضداد','الكلمة','الضد'],V:['آيات صوتية','رقم السورة (1-114)','رقم الآية'],P:['مشاهير','صفحة ويكيبيديا بالإنجليزي (مثل Lionel_Messi)','الاسم بالعربي (افصل بـ |)']},L={Q,F,C,A,V,P:PP};let EN={},tab='Q';
function apply(d){if(!d)return;for(const k in L)if(d[k]&&d[k].length)L[k].splice(0,L[k].length,...d[k]);if(d.en)EN=d.en}

const LS=k=>{try{return localStorage[k]||''}catch(e){return ''}};const clean=()=>{for(const k in L){const c=L[k].filter(r=>String(r[0]).trim()&&String(r[1]).trim());L[k].splice(0,L[k].length,...c)}return{Q,F,C,A,V,P:PP,en:EN}};

async function sv(){const db=clean();try{localStorage.taha_db=JSON.stringify(db);localStorage.taha_key=$('#ky').value}catch(e){}
if(!location.protocol.startsWith('http')){am('تم الحفظ محلياً (يعمل على هذا المتصفح فقط)');return}
try{const r=await fetch('/api/q',{method:'POST',headers:{'Content-Type':'application/json','x-key':$('#ky').value},body:JSON.stringify(db)});am(r.ok?'✅ تم الحفظ وتحديث البث مباشرة':r.status==403?'❌ مفتاح الإدارة غير صحيح':'❌ فشل الحفظ')}catch(e){am('❌ تعذر الاتصال بالسيرفر')}}
function adr(){const a=$('#ad'),t=TABS[tab];a.hidden=false;let body;
if(tab=='E')body='<div>'+Object.entries(G).map(([k,v])=>`<label><input type=checkbox ${EN[k]===false?'':'checked'} onchange="EN['${k}']=this.checked"> ${v.n}</label>`).join('')+'<div style="color:#9a9">الأنواع غير المحددة تُتخطى في الوضع التلقائي. السور والمسائل وحرب بحر تتولد تلقائياً.</div></div>';
else body=`<div class=hd><span>${t[1]}</span><span>${t[2]}</span><span style="flex:0 0 40px"></span></div><div>`+L[tab].map((r,i)=>`<div class=ar><input value="${E(r[0])}" oninput="L[tab][${i}][0]=this.value"><input value="${E(r[1])}" oninput="L[tab][${i}][1]=this.value"><button onclick="L[tab].splice(${i},1);adr()">🗑</button></div>`).join('')+'</div><div><button onclick="L[tab].push([\'\',\'\']);adr()">➕ إضافة</button></div>';
a.innerHTML=`<div class=ah><b>⚙️ لوحة التحكم — مسابقات طه</b><button onclick="$('#ad').hidden=true">✖ إغلاق</button></div><div class=tb>`+Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';adr()">${v[0]} (${L[k].length})</button>`).join('')+`<button class="${tab=='E'?'on':''}" onclick="tab='E';adr()">الأنواع</button></div>`+body+`<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><input id=ky type=password placeholder="مفتاح الإدارة" value="${E(LS('taha_key'))}"><button onclick="sv()">💾 حفظ وتحديث البث</button></div><div id=am style="margin:8px auto;color:#1fe01f"></div><div style="display:flex;gap:6px"><button onclick="$('#jt').value=JSON.stringify(clean())">⬇ تصدير</button><button onclick="try{apply(JSON.parse($('#jt').value));adr()}catch(e){am('JSON غير صالح')}">⬆ استيراد</button></div><textarea id=jt rows=5 placeholder="للنسخ الاحتياطي: صدّر ثم احفظ النص، أو الصق نصاً قديماً هنا ثم استيراد"></textarea>`}
